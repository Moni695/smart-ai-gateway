name: CI & Agent Evals

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test_and_eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit & Integration Tests
        run: |
          pytest tests -v

      - name: Run 3-Policy Evaluation Benchmark
        run: |
          python evals/benchmark_runner.py

      - name: Upload Benchmark Results Chart
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-chart
          path: benchmark_results.png
